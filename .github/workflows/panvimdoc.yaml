# TODO: doesn't handle `::: warning` blocks
# TODO: doesn't handle links to other files

name: Update vimdocs

on:
  push:
    branches: [main]
    paths:
      - doc/**
      - .github/workflows/panvimdoc.yaml

permissions:
  contents: write

jobs:
  docs:
    if: github.repository == 'saghen/blink.cmp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: kdheepak/panvimdoc@d5aa723b69582b89ff16d86e2e93e735e1ae4ad5 # v6.1.0
        with:
          vimdoc: blink-cmp
          pandoc: doc/vimdoc.md
          version: NVIM v0.12.0
          shiftheadinglevelby: 0
          incrementheadinglevelby: 0
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "docs: update vimdocs"
          branch: ${{ github.head_ref }}
